name: Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build (for example v1.0.0)"
        required: true
        type: string

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "11.3"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate requested tag
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected a version tag such as v1.0.0"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve package version
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          IS_BRANCH_PUSH: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        run: |
          if [[ "$IS_BRANCH_PUSH" == 'true' ]]; then
            RELEASE_TAG="v$(node -p "require('./package.json').version")"
          else
            RELEASE_TAG="$REQUESTED_TAG"
          fi
          node scripts/check-version.mjs "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Record immutable build commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libasound2-dev libssl-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Check release version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/check-version.mjs "$RELEASE_TAG"
      - run: npm run build
      - run: npm run check:release
      - run: python scripts/check-signing.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm run package:source
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: artifacts/onyx-${{ steps.tag.outputs.version }}-source.zip*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  build:
    name: ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-15
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg -- --locked
            artifact: macos
          - name: Windows x64
            os: windows-2022
            targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis -- --locked
            artifact: windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Configure optional Apple signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python scripts/configure-signing.py
      - name: Build release packages
        run: npm run tauri build -- ${{ matrix.args }}
      - name: Verify and collect macOS packages
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          app=target/universal-apple-darwin/release/bundle/macos/Onyx.app
          node scripts/check-macos-bundle.mjs "$app"
          mkdir -p release-assets
          shopt -s nullglob
          dmgs=(target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1
          cp "${dmgs[0]}" "release-assets/Onyx_${VERSION}_universal.dmg"
          status=unsigned
          if [[ -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            codesign --verify --deep --strict "$app"
            codesign --verify --strict "${dmgs[0]}"
            status=signed
            if [[ -n "${APPLE_ID:-}" ]]; then
              xcrun stapler validate "$app"
              spctl --assess --type execute --verbose "$app"
              status='signed and notarized'
            fi
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app" "release-assets/Onyx_${VERSION}_universal.app.zip"
          echo "$status" > release-assets/macos-signing.txt
      - name: Verify and collect Windows packages
        if: runner.os == 'Windows'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $binary = 'target/x86_64-pc-windows-msvc/release/onyx.exe'
          if (-not (Test-Path $binary)) { throw 'Missing application executable' }
          $config = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $mustSign = $config.bundle.windows.certificateThumbprint -or $config.bundle.windows.signCommand
          $statuses = @($binary, $installers[0].FullName) | ForEach-Object { (Get-AuthenticodeSignature $_).Status.ToString() }
          if ($mustSign -and @($statuses | Where-Object { $_ -ne 'Valid' }).Count) { throw 'Configured Authenticode signing did not validate' }
          if (@($statuses | Where-Object { $_ -ne 'Valid' -and $_ -ne 'NotSigned' }).Count) { throw 'Invalid Authenticode signature' }
          if (@($statuses | Select-Object -Unique).Count -ne 1) { throw 'Application and installer signing states differ' }
          New-Item release-assets -ItemType Directory -Force | Out-Null
          Copy-Item $installers[0].FullName "release-assets/Onyx_$($env:VERSION)_x64-setup.exe"
          $status = if ($statuses[0] -eq 'Valid') { 'signed' } else { 'unsigned' }
          Set-Content release-assets/windows-signing.txt $status -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  publish:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish only after every package passes
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
          BRANCH_PUSH: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        with:
          script: |
            const publish = require('./scripts/publish-release.cjs');
            const url = await publish({ github, context, directory: 'release-assets',
              tag: process.env.RELEASE_TAG, sha: process.env.RELEASE_SHA,
              branchPush: process.env.BRANCH_PUSH === 'true' });
            core.notice(`Release: ${url}`);
